name: Build Godot APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot templates, keystore and editor settings
        run: |
          mkdir -p ~/.local/share/godot ~/.config/godot
          cp -r /root/.local/share/godot/export_templates ~/.local/share/godot/
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /tmp/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          godot --headless --quit || true
          ls ~/.config/godot
          SDK=$(ls -d /usr/lib/android-sdk 2>/dev/null || echo "$ANDROID_HOME")
          JDK=$(ls -d /usr/lib/jvm/java-17-openjdk-* | head -n1)
          echo "SDK=$SDK JDK=$JDK"
          SETTINGS=~/.config/godot/editor_settings-4.3.tres
          [ -f "$SETTINGS" ] || printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
          echo "export/android/android_sdk_path = \"$SDK\"" >> "$SETTINGS"
          echo "export/android/java_sdk_path = \"$JDK\"" >> "$SETTINGS"
          echo "export/android/debug_keystore = \"/tmp/debug.keystore\"" >> "$SETTINGS"
          echo "export/android/debug_keystore_user = \"androiddebugkey\"" >> "$SETTINGS"
          echo "export/android/debug_keystore_pass = \"android\"" >> "$SETTINGS"

      - name: Import project
        working-directory: godot_project
        run: godot --headless --verbose --import || true

      - name: Export debug APK
        working-directory: godot_project
        run: |
          mkdir -p ../build
          godot --headless --verbose --export-debug "Android" ../build/strikepoint.apk
          ls -la ../build

      - uses: actions/upload-artifact@v4
        with:
          name: strikepoint-apk
          path: build/strikepoint.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-apk-${{ github.run_number }}
          name: StrikePoint APK ${{ github.run_number }}
          files: build/strikepoint.apk
